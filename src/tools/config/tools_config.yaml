# 调试工具配置
param_config:
  motor:
    max_linear_speed: 0.5
    max_angular_speed: 1.0
  serial:
    baudrate: 115200
    port: /dev/ttyS2
data_monitor:
  topics:
    - /lawnmower/imu
    - /lawnmower/gps
    - /lawnmower/left_wheel_speed
    - /lawnmower/right_wheel_speed
  update_frequency: 1.0  # 监控刷新频率 (Hz)
status_query:
  query_type: 3  # 0=轮速 1=IMU 2=GPS 3=全部
  query_frequency: 1.0  # 查询频率 (Hz)