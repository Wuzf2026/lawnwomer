# 串口配置（RK3588）
serial_port: "/dev/ttyUSB0"
serial_baudrate: 115200
# 坐标系配置
frame_id:
  base: "base_link"
  lidar: "orbbec_lidar_link"
  imu: "hesai_imu_link"
  gps: "um982_gps_link"
# 传感器频率
sensor_rate:
  pointcloud: 10.0  # Hz
  imu: 100.0        # Hz
  gps: 10.0         # Hz
# 轮距（米）
wheel_base: 0.5