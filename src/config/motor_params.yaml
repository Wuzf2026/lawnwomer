motor:
  left_wheel:
    pid:
      kp: 0.8
      ki: 0.1
      kd: 0.05
    max_speed: 1.0  # 最大线速度 m/s
    encoder_resolution: 1024  # 编码器分辨率
  right_wheel:
    pid:
      kp: 0.8
      ki: 0.1
      kd: 0.05
    max_speed: 1.0
    encoder_resolution: 1024
  serial:
    port: /dev/ttyS2
    baudrate: 115200
    timeout: 0.1
  odom:
    publish_rate: 50  # Hz
    wheel_base: 0.5   # 轮距 m
    wheel_radius: 0.1 # 轮径 m